name: Go checks

on:
  push:
    branches: [hw2-pos]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
